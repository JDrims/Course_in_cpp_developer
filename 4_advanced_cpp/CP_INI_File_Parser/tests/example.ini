; ============================================
; Тестовый INI-файл для проверки парсера
; Кодировка: UTF-8 без BOM
; ============================================

; Комментарий до первой секции — должен игнорироваться
; Ещё один комментарий

[Section1]
; Обычные переменные
var1=5.0
var2=какая-то строка
var3=42
var4=3.14

; Комментарий к отдельному параметру
var5=100 ; inline-комментарий после значения

; Значение с пробелами внутри
var6=hello world with spaces

; Значение с русскими буквами
var7=значение_2

; Пробелы вокруг равно
var8   =   999

; Пробелы в конце и начале значения
var9=   trimmed value   

[Section2]
var1=1
var2=значение_2

; Пустые значения
empty_string=
empty_int=

; Дробные числа
pi=3.14159
negative=-42
zero=0

[Section3]
; Секция без переменных — для проверки подсказки
; "в секции нет переменных"

[Section4]
Mode=
Vid=

; Секции с пробелами в имени
[  Padded Section  ]
key1=value1

; Секция с дефисом и подчёркиванием
[my-section_2]
key-x=1
key_y=2

; Повторяющаяся секция — должна дополнить Section1
[Section1]
var10=добавлено позже
var1=1.0 ; переприсваиваем значение